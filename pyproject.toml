[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huaweicloud-marketplace-agent"
version = "0.1.0"
description = "Huawei Cloud Marketplace recommendation agent using openJiuwen harness and skills"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openjiuwen @ git+https://github.com/openJiuwen-ai/agent-core.git@4836fc2815b897bf022e36d5df22481fb446047d",
  "httpx[socks]>=0.28,<1",
  "python-dotenv>=1.2,<2",
]

[project.scripts]
marketplace-agent = "marketplace_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"skills/marketplace-recommendation" = "marketplace_agent/bundled_skills/marketplace-recommendation"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls live Huawei Marketplace", "llm: calls a real paid model (opt in)"]
